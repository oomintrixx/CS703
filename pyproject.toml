[project]
name = "cs703"
version = "0.1.0"
description = "Predicting Parking Pressure Across New York City (CS703, Fall 2026)"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sodapy>=2.2.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
